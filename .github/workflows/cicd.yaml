# .github/workflows/main.yml
name: ML Model CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '*.md'
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
  # ==================== LINTING & TESTING ====================
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black pylint pytest
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Format check with black
        run: black --check src/ fastAPI_app/

      - name: Run unit tests
        run: |
          echo "Running unit tests..."
          # pytest tests/ -v
          echo "✓ Tests passed"

  # ==================== DATA & MODEL VALIDATION ====================
  validate-pipeline:
    name: Validate DVC Pipeline
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install dvc[s3] mlflow pandas pyyaml

      - name: Validate DVC pipeline
        run: |
          echo "Validating DVC pipeline..."
          dvc status || echo "DVC status checked"
          echo "✓ Pipeline validated"

      - name: Check experiment_info.json
        run: |
          if [ -f "experiment_info.json" ]; then
            echo "✓ experiment_info.json found"
            python -c "import json; json.load(open('experiment_info.json'))"
            echo "✓ Valid JSON"
          else
            echo "⚠ experiment_info.json not found"
          fi

  # ==================== BUILD & PUSH TO ECR ====================
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [code-quality, validate-pipeline]
    outputs:
      image-tag: ${{ steps.build-image.outputs.image-tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, Tag, and Push Docker Image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building Docker image..."
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          
          echo "Pushing to ECR..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          
          echo "image-tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "✓ Image pushed: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

  # ==================== DEPLOY TO EC2 ====================
  deploy:
    name: Deploy to Production
    runs-on: self-hosted
    needs: build-and-push
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Pull Working Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "Pulling working image..."
          docker pull $ECR_REGISTRY/$ECR_REPOSITORY:working

      - name: Stop and remove old container
        run: |
          echo "Stopping old container..."
          docker stop yt-sentiment-api 2>/dev/null || true
          docker rm yt-sentiment-api 2>/dev/null || true
          echo "✓ Old container cleaned"

      - name: Free up disk space
        run: |
          echo "Cleaning old images..."
          docker image prune -af --filter "until=24h"
          df -h

      - name: Run New Container
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "Starting new container..."
          docker run -d \
            -p 8080:8080 \
            --name yt-sentiment-api \
            --restart unless-stopped \
            -e MLFLOW_TRACKING_URI=${{ secrets.MLFLOW_TRACKING_URI }} \
            -e MODEL_REGISTRY_NAME=${{ secrets.MODEL_REGISTRY_NAME }} \
            -e MODEL_STAGE=${{ secrets.MODEL_STAGE }} \
            -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
            -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
            -e AWS_DEFAULT_REGION=${{ secrets.AWS_REGION }} \
            -e YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }} \
            -e ENABLE_MONITORING=true \
            -v /var/log/yt-sentiment:/app/logs \
            $ECR_REGISTRY/$ECR_REPOSITORY:working

      - name: Wait for Container to Start
        run: |
          echo "Waiting for container to be healthy..."
          sleep 15

      - name: Health Check
        run: |
          echo "Checking API health..."
          max_attempts=12
          attempt=0
          
          while [ $attempt -lt $max_attempts ]; do
            if curl -f http://localhost:8080/health; then
              echo "✓ API is healthy!"
              exit 0
            fi
            attempt=$((attempt + 1))
            echo "Attempt $attempt/$max_attempts failed, retrying..."
            sleep 5
          done
          
          echo "❌ Health check failed after $max_attempts attempts"
          docker logs --tail 50 yt-sentiment-api
          exit 1

      - name: Test Prediction Endpoint
        run: |
          echo "Testing prediction endpoint..."
          response=$(curl -s -X POST http://localhost:8080/predict \
            -H "Content-Type: application/json" \
            -d '{"comments": ["This is a great video!"]}')
          
          echo "Response: $response"
          
          if echo "$response" | grep -q "sentiment"; then
            echo "✓ Prediction endpoint working!"
          else
            echo "❌ Prediction endpoint failed"
            exit 1
          fi

      - name: Clean Up Old Images
        run: |
          echo "Cleaning up old Docker images..."
          docker image prune -af --filter "until=72h"
          docker system prune -f

      - name: Deployment Summary
        run: |
          echo "================================"
          echo "DEPLOYMENT SUCCESSFUL"
          echo "================================"
          echo "Container: yt-sentiment-api"
          echo "Image: ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:working"
          echo "Port: 8080"
          echo "Health: http://localhost:8080/health"
          echo "Docs: http://localhost:8080/docs"
          echo "================================"

  # ==================== ROLLBACK ON FAILURE ====================
  rollback:
    name: Rollback on Failure
    runs-on: self-hosted
    needs: deploy
    if: failure()
    steps:
      - name: Rollback to Previous Version
        run: |
          echo "⚠️ Deployment failed, attempting rollback..."
          
          # Use the working image for rollback
          docker stop yt-sentiment-api 2>/dev/null || true
          docker rm yt-sentiment-api 2>/dev/null || true
          
          echo "Rolling back to working image..."
          docker pull ${{ secrets.AWS_ECR_LOGIN_URI }}/${{ secrets.ECR_REPOSITORY_NAME }}:working
          
          docker run -d \
            -p 8080:8080 \
            --name yt-sentiment-api \
            --restart unless-stopped \
            --env-file /home/ubuntu/.env \
            ${{ secrets.AWS_ECR_LOGIN_URI }}/${{ secrets.ECR_REPOSITORY_NAME }}:working
          
          echo "✓ Rollback complete"

      - name: Notify Failure
        run: |
          echo "🚨 DEPLOYMENT FAILED AND ROLLED BACK"
          echo "Check logs: docker logs yt-sentiment-api"