# params.yaml

# ==================== DATA INGESTION ====================
data_ingestion:
  test_size: 0.20
  random_state: 42

# ==================== DATA PREPROCESSING ====================
data_preprocessing:
  min_text_length: 3
  max_text_length: 5000
  remove_duplicates: true

# ==================== MODEL BUILDING ====================
model_building:
  # Feature Engineering
  ngram_range: [1, 3]  
  max_features: 1000
  min_df: 2
  max_df: 0.95
  
  # LightGBM Hyperparameters
  learning_rate: 0.09
  max_depth: 20
  n_estimators: 367
  num_leaves: 31
  reg_alpha: 0.1
  reg_lambda: 0.1
  
  # Model Configuration
  objective: multiclass
  num_class: 3
  metric: multi_logloss
  is_unbalance: true
  random_state: 42

# ==================== MODEL EVALUATION ====================
model_evaluation:
  # Metrics to track
  primary_metric: f1_score_weighted
  metrics_to_log:
    - accuracy
    - precision_weighted
    - recall_weighted
    - f1_score_weighted
    - roc_auc_ovr

# ==================== MONITORING CONFIGURATION ====================
monitoring:
  # Data Drift Detection
  data_drift:
    enabled: true
    threshold: 0.5
    stattest: wasserstein
    cat_stattest: chi-squared
    
  # Model Performance Monitoring
  performance:
    enabled: true
    accuracy_threshold: 0.75
    f1_threshold: 0.70
    degradation_threshold: 0.05
    
  # Data Quality Checks
  data_quality:
    enabled: true
    missing_values_threshold: 0.05
    duplicates_threshold: 0.01
    min_text_length: 3
    max_text_length: 5000
    
  # Reference Data
  reference_data:
    path: reference_data/train_reference.csv
    sample_size: 5000
    update_frequency: monthly

# ==================== MODEL REGISTRY ====================
model_registry:
  model_name: yt_chrome_plugin_model
  
  # Stage Transition Rules
  auto_promote_to_production: false
  
  # Promotion Thresholds
  min_accuracy_threshold: 0.75
  min_f1_threshold: 0.70
  performance_improvement_threshold: 0.02
  
  # Model Metadata
  model_type: lightgbm
  framework: lightgbm
  task: sentiment_analysis
  dataset: youtube_comments

# ==================== DEPLOYMENT ====================
deployment:
  # API Configuration
  api_host: 0.0.0.0
  api_port: 8000
  workers: 4
  
  # Model Loading
  model_path: lgbm_model.pkl
  vectorizer_path: tfidf_vectorizer.pkl
  
  # Inference Configuration
  batch_size: 32
  max_comment_length: 5000

# ==================== EXPERIMENT TRACKING ====================
experiment:
  experiment_name: yt_sentiment_analysis
  dataset_version: v1.0
  
  # Tags
  tags:
    project: youtube-sentiment-analysis
    framework: lightgbm
    task: multiclass-classification